name: Build Matrix Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        enable_tls: [OFF, ON]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libmbedtls-dev

      - name: Configure CMake (ENABLE_MQTT_TLS=${{ matrix.enable_tls }})
        run: |
          mkdir build
          cd build
          cmake -DENABLE_MQTT_TLS=${{ matrix.enable_tls }} ..

      - name: Build Firmware
        run: |
          cd build
          make -j$(nproc)
